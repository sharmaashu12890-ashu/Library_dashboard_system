{% extends "base.html" %}

{% block title %}
Register User
{% endblock %}

{% block content %}

<h2 class="mb-4">Register User</h2>

<form method="POST">

    <div class="mb-3">

        <label class="form-label">Name</label>

        <input
            type="text"
            name="name"
            class="form-control"
            required>

    </div>

    <div class="mb-3">

        <label class="form-label">Email</label>

        <input
            type="email"
            name="email"
            class="form-control"
            required>

    </div>

    <div class="mb-3">

        <label class="form-label">Password</label>

        <input
            type="password"
            name="password"
            class="form-control"
            required>

    </div>

    <button class="btn btn-success">
        Register
    </button>

    <a href="{{ url_for('routes.user_list') }}" class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
