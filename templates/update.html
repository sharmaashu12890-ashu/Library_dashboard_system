{% extends "base.html" %}

{% block title %}
Update User
{% endblock %}

{% block content %}

<h2 class="mb-4">Update User</h2>

<form method="POST">

    <div class="mb-3">

        <label class="form-label">Name</label>

        <input
            type="text"
            name="name"
            value="{{ user.name }}"
            class="form-control"
            required>

    </div>

    <div class="mb-3">

        <label class="form-label">Email</label>

        <input
            type="email"
            name="email"
            value="{{ user.email }}"
            class="form-control"
            required>

    </div>

    <button class="btn btn-primary">
        Update
    </button>

   
    <a href="{{ url_for('routes.user_list') }}"
       class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
